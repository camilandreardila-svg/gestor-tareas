databases:
  - name: tareas-db
    plan: free
    databaseName: tareas
    user: tareas

services:
  - type: web
    name: gestor-tareas
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: tareas-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
